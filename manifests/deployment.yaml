apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: archon-knowledge-base
  labels:
    app: mcp-server
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: archon
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: archon
        app.kubernetes.io/component: mcp
    spec:
      containers:
      - name: mcp-server
        image: ghcr.io/bdchatham/archon-mcp-server:latest
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: QUERY_SERVICE_URL
          value: "http://query.archon-knowledge-base:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
