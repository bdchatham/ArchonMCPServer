apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: archon-mcp-server
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Git revision to build
      default: mainline
    - name: image-name
      type: string
      description: Container image name
      default: ghcr.io/bdchatham/archon-mcp-server
  
  workspaces:
    - name: source
      description: Source code workspace
  
  tasks:
    - name: build-and-push
      taskRef:
        name: buildah-build
      params:
        - name: IMAGE
          value: "$(params.image-name):$(params.revision)"
        - name: DOCKERFILE
          value: "./Dockerfile"
        - name: CONTEXT
          value: "."
      workspaces:
        - name: source
          workspace: source
    
    - name: deploy
      taskRef:
        name: kubectl-apply
      runAfter:
        - build-and-push
      params:
        - name: manifest-dir
          value: "./manifests"
        - name: namespace
          value: "archon-knowledge-base"
      workspaces:
        - name: source
          workspace: source
