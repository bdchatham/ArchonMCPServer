[project]
name = "archon-mcp-server"
version = "0.1.0"
description = "MCP server for Archon RAG system"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0",
    "aphex-service-clients @ git+https://github.com/bdchatham/AphexServiceClients.git@mainline",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
